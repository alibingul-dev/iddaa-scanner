name: fetch-odds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch.py, .github/workflows/fetch.yml]
permissions:
  contents: write
concurrency: fetch-odds
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json picks.json history
          git diff --cached --quiet || git commit -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q -X theirs || true
          git push
