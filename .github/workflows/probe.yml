name: probe
on:
  push:
    branches: [main]
    paths: [tools/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
concurrency: fetch-odds
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q
          git add probe
          git diff --cached --quiet || git commit -m "probe results"
          git push
