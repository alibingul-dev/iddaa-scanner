name: backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/backtest.py, .github/workflows/backtest.yml]
permissions:
  contents: write
concurrency: fetch-odds
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/backtest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest.json backtest
          git diff --cached --quiet || git commit -m "backtest $(date -u +%Y-%m-%d)"
          git pull --rebase -q -X theirs || true
          git push
