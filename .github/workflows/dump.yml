name: dump-rows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/dump_rows.py, .github/workflows/dump.yml]
permissions:
  contents: write
concurrency: fetch-odds
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/dump_rows.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest/rows.csv.gz
          git diff --cached --quiet || git commit -m "rows $(date -u +%Y-%m-%d)"
          git pull --rebase -q -X theirs || true
          git push
